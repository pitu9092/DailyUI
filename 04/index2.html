<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanWise - Smart EMI Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-50: #eff6ff;
            --primary-100: #dbeafe;
            --primary-200: #bfdbfe;
            --primary-300: #93c5fd;
            --primary-400: #60a5fa;
            --primary-500: #3b82f6;
            --primary-600: #2563eb;
            --primary-700: #1d4ed8;
            --primary-800: #1e40af;
            --primary-900: #1e3a8a;
            --accent-400: #4ade80;
            --accent-500: #22c55e;
            --success: #22c55e;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --border-light: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --primary-50: #0f172a;
            --primary-100: #1e293b;
            --primary-200: #334155;
            --primary-300: #475569;
            --primary-400: #64748b;
            --primary-500: #94a3b8;
            --primary-600: #3b82f6;
            --primary-700: #60a5fa;
            --primary-800: #93c5fd;
            --primary-900: #bfdbfe;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #64748b;
            --border-light: #334155;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--primary-50) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            max-width: 430px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 22px;
            color: var(--primary-600);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 18px;
        }

        .theme-toggle {
            width: 48px;
            height: 28px;
            background: var(--bg-tertiary);
            border-radius: 14px;
            padding: 2px;
            cursor: pointer;
            position: relative;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-toggle-handle {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle.active {
            background: var(--primary-500);
        }

        .theme-toggle.active .theme-toggle-handle {
            transform: translateX(20px);
        }

        /* EMI Card */
        .emi-card {
            background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-700) 100%);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-xl);
        }

        .emi-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .emi-label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .emi-amount {
            font-size: 48px;
            font-weight: 800;
            color: white;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .emi-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .emi-meta-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .emi-meta-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .emi-meta-value {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        /* Input Section */
        .input-section {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .input-group {
            margin-bottom: 28px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .input-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-icon {
            width: 20px;
            height: 20px;
            color: var(--primary-500);
        }

        .input-value-display {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary-600);
            background: var(--primary-50);
            padding: 6px 12px;
            border-radius: 10px;
        }

        .slider-container {
            position: relative;
            height: 50px;
            display: flex;
            align-items: center;
        }

        .slider-track {
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            position: relative;
        }

        .slider-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-500), var(--primary-600));
            border-radius: 3px;
            position: absolute;
            top: 0;
            left: 0;
            transition: width 0.15s ease-out;
        }

        .slider-thumb {
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border: 3px solid var(--primary-500);
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            transition: transform 0.15s ease-out, box-shadow 0.15s;
            box-shadow: var(--shadow-md);
        }

        .slider-thumb:active {
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: var(--shadow-lg);
            cursor: grabbing;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-light);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: all 0.2s ease;
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px var(--primary-100);
        }

        /* Tenure Toggle */
        .tenure-toggle {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 4px;
            margin-top: 12px;
        }

        .tenure-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tenure-option.active {
            background: var(--bg-primary);
            color: var(--primary-600);
            box-shadow: var(--shadow-sm);
        }

        /* Breakdown Section */
        .breakdown-section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .breakdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .breakdown-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .breakdown-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .breakdown-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .breakdown-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .breakdown-card.principal .breakdown-value {
            color: var(--primary-600);
        }

        .breakdown-card.interest .breakdown-value {
            color: var(--accent-500);
        }

        /* Chart Container */
        .chart-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .chart-wrapper {
            position: relative;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .legend-dot.principal {
            background: var(--primary-500);
        }

        .legend-dot.interest {
            background: var(--accent-400);
        }

        /* CTA Button */
        .cta-button {
            width: 100%;
            padding: 18px 32px;
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-600) 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-lg);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 30px -10px rgba(59, 130, 246, 0.4);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* Responsive */
        @media (max-width: 380px) {
            .container {
                padding: 16px;
            }
            .emi-amount {
                font-size: 40px;
            }
            .breakdown-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Accessibility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Focus states */
        *:focus-visible {
            outline: 3px solid var(--primary-500);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">L</div>
                <span>LoanWise</span>
            </div>
            <button class="theme-toggle" aria-label="Toggle dark mode" id="themeToggle">
                <div class="theme-toggle-handle">
                    <span class="icon">🌙</span>
                </div>
            </button>
        </header>

        <!-- EMI Card -->
        <div class="emi-card animate-in">
            <div class="emi-label">Your Monthly EMI</div>
            <div class="emi-amount" id="emiAmount">₹0</div>
            <div class="emi-meta">
                <div class="emi-meta-item">
                    <span class="emi-meta-label">Loan Amount</span>
                    <span class="emi-meta-value" id="summaryPrincipal">₹0</span>
                </div>
                <div class="emi-meta-item">
                    <span class="emi-meta-label">Interest Rate</span>
                    <span class="emi-meta-value" id="summaryRate">0%</span>
                </div>
                <div class="emi-meta-item">
                    <span class="emi-meta-label">Tenure</span>
                    <span class="emi-meta-value" id="summaryTenure">0 yr</span>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section animate-in stagger-1">
            <!-- Loan Amount -->
            <div class="input-group">
                <div class="input-header">
                    <label class="input-label" for="loanAmount">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
                        </svg>
                        Loan Amount
                    </label>
                    <span class="input-value-display" id="loanAmountDisplay">₹0</span>
                </div>
                <div class="slider-container" id="loanSliderContainer">
                    <div class="slider-track">
                        <div class="slider-fill" id="loanSliderFill"></div>
                    </div>
                    <div class="slider-thumb" id="loanSliderThumb"></div>
                </div>
                <input type="number" class="input-field" id="loanAmountInput" min="10000" max="10000000" step="10000" value="500000" aria-label="Loan amount in rupees">
            </div>

            <!-- Interest Rate -->
            <div class="input-group">
                <div class="input-header">
                    <label class="input-label" for="interestRate">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                        </svg>
                        Interest Rate
                    </label>
                    <span class="input-value-display" id="interestRateDisplay">0%</span>
                </div>
                <div class="slider-container" id="rateSliderContainer">
                    <div class="slider-track">
                        <div class="slider-fill" id="rateSliderFill"></div>
                    </div>
                    <div class="slider-thumb" id="rateSliderThumb"></div>
                </div>
                <input type="number" class="input-field" id="interestRateInput" min="1" max="30" step="0.1" value="10.5" aria-label="Interest rate percentage">
            </div>

            <!-- Loan Tenure -->
            <div class="input-group">
                <div class="input-header">
                    <label class="input-label" for="loanTenure">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Loan Tenure
                    </label>
                    <span class="input-value-display" id="loanTenureDisplay">5 yr</span>
                </div>
                <div class="slider-container" id="tenureSliderContainer">
                    <div class="slider-track">
                        <div class="slider-fill" id="tenureSliderFill"></div>
                    </div>
                    <div class="slider-thumb" id="tenureSliderThumb"></div>
                </div>
                <input type="number" class="input-field" id="loanTenureInput" min="1" max="30" step="1" value="5" aria-label="Loan tenure in years">
                <div class="tenure-toggle" id="tenureToggle" role="group" aria-label="Select tenure unit">
                    <button class="tenure-option active" data-value="years" type="button">Years</button>
                    <button class="tenure-option" data-value="months" type="button">Months</button>
                </div>
            </div>
        </div>

        <!-- Breakdown Section -->
        <div class="breakdown-section animate-in stagger-2">
            <h2 class="section-title">Payment Breakdown</h2>
            <div class="breakdown-grid">
                <div class="breakdown-card principal">
                    <div class="breakdown-label">Total Principal</div>
                    <div class="breakdown-value" id="totalPrincipal">₹0</div>
                </div>
                <div class="breakdown-card interest">
                    <div class="breakdown-label">Total Interest</div>
                    <div class="breakdown-value" id="totalInterest">₹0</div>
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="chart-container animate-in stagger-3">
            <div class="chart-wrapper">
                <canvas id="paymentChart"></canvas>
            </div>
            <div class="chart-legend">
                <div class="legend-item">
                    <div class="legend-dot principal"></div>
                    <span>Principal</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot interest"></div>
                    <span>Interest</span>
                </div>
            </div>
        </div>

        <!-- CTA Button -->
        <button class="cta-button animate-in stagger-4" id="ctaButton">
            Apply for Loan Offer
        </button>
    </div>

    <script>
        // State management
        const state = {
            loanAmount: 500000,
            interestRate: 10.5,
            tenure: 5,
            tenureUnit: 'years',
            chart: null
        };

        // DOM Elements
        const elements = {
            emiAmount: document.getElementById('emiAmount'),
            summaryPrincipal: document.getElementById('summaryPrincipal'),
            summaryRate: document.getElementById('summaryRate'),
            summaryTenure: document.getElementById('summaryTenure'),
            loanAmountDisplay: document.getElementById('loanAmountDisplay'),
            loanAmountInput: document.getElementById('loanAmountInput'),
            loanSliderThumb: document.getElementById('loanSliderThumb'),
            loanSliderFill: document.getElementById('loanSliderFill'),
            interestRateDisplay: document.getElementById('interestRateDisplay'),
            interestRateInput: document.getElementById('interestRateInput'),
            rateSliderThumb: document.getElementById('rateSliderThumb'),
            rateSliderFill: document.getElementById('rateSliderFill'),
            loanTenureDisplay: document.getElementById('loanTenureDisplay'),
            loanTenureInput: document.getElementById('loanTenureInput'),
            tenureSliderThumb: document.getElementById('tenureSliderThumb'),
            tenureSliderFill: document.getElementById('tenureSliderFill'),
            tenureOptions: document.querySelectorAll('.tenure-option'),
            totalPrincipal: document.getElementById('totalPrincipal'),
            totalInterest: document.getElementById('totalInterest'),
            themeToggle: document.getElementById('themeToggle'),
            ctaButton: document.getElementById('ctaButton')
        };

        // EMI Calculation (Indian method - flat rate simplified)
        function calculateEMI(principal, rate, tenureMonths) {
            const monthlyRate = rate / 12 / 100;
            if (monthlyRate === 0) return principal / tenureMonths;

            const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, tenureMonths)) /
                        (Math.pow(1 + monthlyRate, tenureMonths) - 1);

            return emi;
        }

        // Format currency (Indian format)
        function formatCurrency(amount, decimals = 0) {
            const formatter = new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
            return formatter.format(amount);
        }

        // Update slider visual
        function updateSlider(sliderThumb, sliderFill, value, min, max) {
            const percent = ((value - min) / (max - min)) * 100;
            sliderThumb.style.left = percent + '%';
            sliderFill.style.width = percent + '%';
        }

        // Update all displays
        function updateDisplay() {
            const tenureMonths = state.tenureUnit === 'years' ? state.tenure * 12 : state.tenure;
            const monthlyEMI = calculateEMI(state.loanAmount, state.interestRate, tenureMonths);
            const totalAmount = monthlyEMI * tenureMonths;
            const totalInterest = totalAmount - state.loanAmount;

            // Main EMI
            elements.emiAmount.textContent = formatCurrency(monthlyEMI);

            // Summary
            elements.summaryPrincipal.textContent = formatCurrency(state.loanAmount);
            elements.summaryRate.textContent = state.interestRate.toFixed(1) + '%';
            elements.summaryTenure.textContent = state.tenureUnit === 'years'
                ? state.tenure + ' yr'
                : state.tenure + ' mo';

            // Input displays
            elements.loanAmountDisplay.textContent = formatCurrency(state.loanAmount);
            elements.interestRateDisplay.textContent = state.interestRate.toFixed(1) + '%';
            elements.loanTenureDisplay.textContent = state.tenureUnit === 'years'
                ? state.tenure + ' yr'
                : state.tenure + ' mo';

            // Breakdown
            elements.totalPrincipal.textContent = formatCurrency(state.loanAmount);
            elements.totalInterest.textContent = formatCurrency(totalInterest);

            // Update sliders
            updateSlider(elements.loanSliderThumb, elements.loanSliderFill, state.loanAmount, 10000, 10000000);
            updateSlider(elements.rateSliderThumb, elements.rateSliderFill, state.interestRate, 1, 30);
            updateSlider(elements.tenureSliderThumb, elements.tenureSliderFill, state.tenure, 1, 30);

            // Update chart
            updateChart(state.loanAmount, totalInterest);
        }

        // Initialize chart
        function initChart() {
            const ctx = document.getElementById('paymentChart').getContext('2d');

            state.chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Principal', 'Interest'],
                    datasets: [{
                        data: [state.loanAmount, 0],
                        backgroundColor: [
                            getComputedStyle(document.documentElement).getPropertyValue('--primary-500').trim(),
                            getComputedStyle(document.documentElement).getPropertyValue('--accent-400').trim()
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + formatCurrency(context.raw);
                                }
                            }
                        }
                    }
                }
            });
        }

        // Update chart data
        function updateChart(principal, interest) {
            if (state.chart) {
                state.chart.data.datasets[0].data = [principal, interest];
                state.chart.update('none');
            }
        }

        // Create draggable slider
        function createSlider(container, thumbElement, fillElement, min, max, inputElement, property, displayElement) {
            let isDragging = false;

            const updateValue = (clientX) => {
                const rect = container.getBoundingClientRect();
                const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const value = Math.round(min + percent * (max - min));

                // Round to appropriate step
                const step = parseFloat(inputElement.step);
                const roundedValue = Math.round(value / step) * step;

                state[property] = roundedValue;
                inputElement.value = roundedValue;

                // Update display formatting
                if (property === 'loanAmount') {
                    displayElement.textContent = formatCurrency(roundedValue);
                } else if (property === 'interestRate') {
                    displayElement.textContent = roundedValue.toFixed(1) + '%';
                } else {
                    displayElement.textContent = state.tenureUnit === 'years'
                        ? roundedValue + ' yr'
                        : roundedValue + ' mo';
                }

                updateDisplay();
            };

            thumbElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                e.preventDefault();
            });

            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                updateValue(e.clientX);
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    updateValue(e.clientX);
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Touch events
            thumbElement.addEventListener('touchstart', (e) => {
                isDragging = true;
                e.preventDefault();
            });

            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                updateValue(e.touches[0].clientX);
            });

            document.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    updateValue(e.touches[0].clientX);
                }
            });

            document.addEventListener('touchend', () => {
                isDragging = false;
            });

            // Input field
            inputElement.addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || min;
                value = Math.max(min, Math.min(max, value));

                state[property] = value;
                updateDisplay();
            });

            // Input validation
            inputElement.addEventListener('blur', (e) => {
                let value = parseFloat(e.target.value);
                if (isNaN(value) || value < min) value = min;
                if (value > max) value = max;

                state[property] = value;
                inputElement.value = value;
                updateDisplay();
            });
        }

        // Tenure toggle
        elements.tenureOptions.forEach(option => {
            option.addEventListener('click', () => {
                elements.tenureOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                state.tenureUnit = option.dataset.value;
                updateDisplay();
            });
        });

        // Theme toggle
        elements.themeToggle.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            elements.themeToggle.classList.toggle('active');

            // Update chart colors
            updateChartColors();

            // Update theme icon
            const icon = elements.themeToggle.querySelector('.icon');
            icon.textContent = isDark ? '🌙' : '☀️';
        });

        function updateChartColors() {
            if (!state.chart) return;

            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-500');
            const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-400');

            state.chart.data.datasets[0].backgroundColor = [primaryColor, accentColor];
            state.chart.update();
        }

        // CTA button interaction
        elements.ctaButton.addEventListener('click', () => {
            elements.ctaButton.style.transform = 'scale(0.95)';
            setTimeout(() => {
                elements.ctaButton.style.transform = '';
                // In production, this would navigate to loan application
                alert(`Loan Offer Request!\n\nEMI: ${formatCurrency(calculateEMI(state.loanAmount, state.interestRate, state.tenureUnit === 'years' ? state.tenure * 12 : state.tenure))}\n\nWe'll process your application shortly.`);
            }, 150);
        });

        // Initialize
        function init() {
            createSlider(
                document.getElementById('loanSliderContainer'),
                elements.loanSliderThumb,
                elements.loanSliderFill,
                10000,
                10000000,
                elements.loanAmountInput,
                'loanAmount',
                elements.loanAmountDisplay
            );

            createSlider(
                document.getElementById('rateSliderContainer'),
                elements.rateSliderThumb,
                elements.rateSliderFill,
                1,
                30,
                elements.interestRateInput,
                'interestRate',
                elements.interestRateDisplay
            );

            createSlider(
                document.getElementById('tenureSliderContainer'),
                elements.tenureSliderThumb,
                elements.tenureSliderFill,
                1,
                30,
                elements.loanTenureInput,
                'tenure',
                elements.loanTenureDisplay
            );

            initChart();
            updateDisplay();

            // Entrance animation
            document.querySelectorAll('.animate-in').forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 + index * 100);
            });
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
