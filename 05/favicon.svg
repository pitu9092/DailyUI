<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <!-- WeatherWise Favicon - Optimized for 16x16, 32x32 -->
    <!-- Simplified for maximum legibility at tiny sizes -->

    <defs>
        <linearGradient id="bgFav" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a"/>
            <stop offset="50%" style="stop-color:#1e40af"/>
            <stop offset="100%" style="stop-color:#1e3a8a"/>
        </linearGradient>
        <linearGradient id="sunFav" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fbbf24"/>
            <stop offset="100%" style="stop-color:#f59e0b"/>
        </linearGradient>
        <linearGradient id="cloudFav" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff"/>
            <stop offset="100%" style="stop-color:#e2e8f0"/>
        </linearGradient>
    </defs>

    <!-- Rounded square -->
    <rect width="512" height="512" rx="120" fill="url(#bgFav)"/>

    <!-- Simplified sun (larger, fewer rays) -->
    <circle cx="160" cy="170" r="75" fill="url(#sunFav)"/>

    <!-- Simplified cloud -->
    <ellipse cx="340" cy="340" rx="100" ry="50" fill="url(#cloudFav)"/>
    <ellipse cx="380" cy="325" rx="65" ry="50" fill="url(#cloudFav)"/>
    <ellipse cx="410" cy="350" rx="50" ry="40" fill="url(#cloudFav)"/>
    <ellipse cx="300" cy="350" rx="75" ry="45" fill="url(#cloudFav)"/>

    <!-- Tiny sparkle (visible at 32x32) -->
    <circle cx="380" cy="130" r="6" fill="#38bdf8"/>
    <circle cx="130" cy="380" r="5" fill="#fbbf24"/>
</svg>