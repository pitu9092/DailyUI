<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWise Icon — Clean View</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            margin-bottom: 40px;
        }
        .icon-wrapper {
            background: transparent;
            padding: 40px;
            border-radius: 24px;
            display: inline-block;
            /* No border, no shadow — pure view */
        }
        .icon-wrapper svg {
            width: 280px;
            height: 280px;
            border-radius: 22%;
            display: block;
        }
        .info {
            margin-top: 32px;
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        @media (max-width: 480px) {
            .icon-wrapper svg {
                width: 200px;
                height: 200px;
            }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Clean View — No Border</span>
        <h1>WeatherWise Icon</h1>
        <p class="subtitle">Pure SVG, no strokes, no borders, no shadows</p>

        <div class="icon-wrapper">
            <!-- PURE ICON SVG — no border, no stroke, no shadow -->
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0f172a"/>
                        <stop offset="40%" style="stop-color:#1e40af"/>
                        <stop offset="100%" style="stop-color:#1e3a8a"/>
                    </linearGradient>
                    <radialGradient id="sun" cx="35%" cy="35%" r="65%">
                        <stop offset="0%" style="stop-color:#fef3c7"/>
                        <stop offset="50%" style="stop-color:#fbbf24"/>
                        <stop offset="100%" style="stop-color:#f59e0b"/>
                    </radialGradient>
                    <linearGradient id="cloud" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ffffff"/>
                        <stop offset="60%" style="stop-color:#f8fafc"/>
                        <stop offset="100%" style="stop-color:#e2e8f0"/>
                    </linearGradient>
                </defs>

                <!-- Background: JUST fill, no stroke -->
                <rect width="512" height="512" rx="120" fill="url(#bg)"/>

                <!-- Cloud group (no shadow filter, clean) -->
                <ellipse cx="295" cy="355" rx="105" ry="40" fill="rgba(0,0,0,0.1)" opacity="0.25"/>
                <ellipse cx="290" cy="325" rx="105" ry="58" fill="url(#cloud)"/>
                <ellipse cx="335" cy="312" rx="72" ry="52" fill="url(#cloud)"/>
                <ellipse cx="370" cy="328" rx="58" ry="46" fill="url(#cloud)"/>
                <ellipse cx="245" cy="328" rx="82" ry="50" fill="url(#cloud)"/>
                <ellipse cx="205" cy="348" rx="68" ry="44" fill="url(#cloud)"/>
                <ellipse cx="272" cy="305" rx="38" ry="18" fill="rgba(255,255,255,0.45)"/>
                <ellipse cx="328" cy="318" rx="28" ry="16" fill="rgba(255,255,255,0.4)"/>

                <!-- Sun with subtle glow -->
                <circle cx="170" cy="170" r="85" fill="#fbbf24" opacity="0.18"/>
                <circle cx="170" cy="170" r="65" fill="url(#sun)"/>

                <!-- Sun rays -->
                <g stroke="url(#sun)" stroke-width="9" stroke-linecap="round" opacity="0.75">
                    <line x1="170" y1="85" x2="170" y2="58"/>
                    <line x1="225" y1="130" x2="250" y2="105"/>
                    <line x1="240" y1="170" x2="270" y2="170"/>
                    <line x1="225" y1="210" x2="250" y2="235"/>
                    <line x1="170" y1="255" x2="170" y2="282"/>
                    <line x1="115" y1="210" x2="90" y2="235"/>
                    <line x1="100" y1="170" x2="70" y2="170"/>
                    <line x1="115" y1="130" x2="90" y2="105"/>
                </g>

                <!-- Sun inner highlight -->
                <circle cx="165" cy="165" r="35" fill="rgba(255,255,255,0.25)"/>

                <!-- Sparkles (aligned) -->
                <g opacity="0.85">
                    <circle cx="355" cy="115" r="6" fill="#38bdf8">
                        <animate attributeName="opacity" values="0.85;0.35;0.85" dur="2.2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="140" cy="360" r="5.5" fill="#fbbf24">
                        <animate attributeName="opacity" values="0.75;0.25;0.75" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
                    </circle>
                    <circle cx="420" cy="250" r="4.5" fill="#38bdf8">
                        <animate attributeName="opacity" values="0.65;0.15;0.65" dur="1.9s" repeatCount="indefinite" begin="0.8s"/>
                    </circle>
                </g>

                <!-- Glass highlight (subtle) -->
                <path d="M 90 70 L 200 55 L 260 120 L 180 180 Q 130 140 90 70"
                      fill="rgba(255,255,255,0.08)" opacity="0.25"/>
            </svg>
        </div>

        <p class="info">
            WeatherWise App Icon v3.0 — Clean version<br>
            No outer stroke, no drop shadow, no border<br>
            Pure glassmorphism design
        </p>
    </div>
</body>
</html>
