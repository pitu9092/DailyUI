<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <!-- WeatherWise App Icon - Designed for Daily UI #005 -->
    <!-- Optimized for iOS/Android app stores, works at all sizes -->

    <defs>
        <!-- Background gradient: Deep blue sky -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a"/>
            <stop offset="50%" style="stop-color:#1e40af"/>
            <stop offset="100%" style="stop-color:#1e3a8a"/>
        </linearGradient>

        <!-- Sun gradient: Warm golden -->
        <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fbbf24"/>
            <stop offset="100%" style="stop-color:#f59e0b"/>
        </linearGradient>

        <!-- Cloud gradient: Crisp white -->
        <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff"/>
            <stop offset="100%" style="stop-color:#cbd5e1"/>
        </linearGradient>

        <!-- Soft outer glow for iOS -->
        <filter id="iosGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feFlood flood-color="#38bdf8" flood-opacity="0.3"/>
            <feComposite in2="blur" operator="in"/>
            <feComposite in="SourceGraphic"/>
        </filter>

        <!-- Strong glow for visual impact -->
        <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="20" result="glow"/>
            <feComposite in="SourceGraphic" in2="glow" operator="over"/>
        </filter>

        <!-- Subtle shadow -->
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Background with rounded corners (iOS standard) -->
    <rect
        width="512"
        height="512"
        rx="120"
        ry="120"
        fill="url(#bgGradient)"
        filter="url(#softShadow)"
    />

    <!-- Glowing accent light (top right) -->
    <circle cx="420" cy="100" r="80" fill="#38bdf8" opacity="0.25" filter="url(#strongGlow)"/>

    <!-- Main Sun - Upper left quadrant -->
    <g filter="url(#iosGlow)">
        <circle cx="150" cy="160" r="70" fill="url(#sunGradient)"/>

        <!-- Sun rays (8 directions) -->
        <g stroke="url(#sunGradient)" stroke-width="14" stroke-linecap="round" opacity="0.9">
            <!-- Top -->
            <line x1="150" y1="75" x2="150" y2="45"/>
            <!-- Top-right -->
            <line x1="215" y1="115" x2="245" y2="85"/>
            <!-- Right -->
            <line x1="235" y1="160" x2="275" y2="160"/>
            <!-- Bottom-right -->
            <line x1="215" y1="205" x2="245" y2="235"/>
            <!-- Bottom -->
            <line x1="150" y1="245" x2="150" y2="275"/>
            <!-- Bottom-left -->
            <line x1="85" y1="205" x2="55" y2="235"/>
            <!-- Left -->
            <line x1="65" y1="160" x2="25" y2="160"/>
            <!-- Top-left -->
            <line x1="85" y1="115" x2="55" y2="85"/>
        </g>
    </g>

    <!-- Cloud cluster - Lower right quadrant -->
    <g filter="url(#iosGlow)">
        <!-- Main cloud body -->
        <ellipse cx="340" cy="340" rx="100" ry="50" fill="url(#cloudGradient)"/>

        <!-- Overlapping cloud puffs (creates depth) -->
        <ellipse cx="380" cy="320" rx="70" ry="55" fill="url(#cloudGradient)"/>
        <ellipse cx="420" cy="350" rx="60" ry="45" fill="url(#cloudGradient)"/>
        <ellipse cx="300" cy="350" rx="80" ry="45" fill="url(#cloudGradient)"/>

        <!-- Cloud highlight (subtle) -->
        <ellipse cx="320" cy="330" rx="40" ry="20" fill="rgba(255,255,255,0.3)"/>
    </g>

    <!-- Sparkle/Star accents (adds liveliness) -->
    <circle cx="380" cy="120" r="8" fill="#38bdf8" opacity="0.9">
        <animate
            attributeName="opacity"
            values="0.9;0.3;0.9"
            dur="2s"
            repeatCount="indefinite"/>
    </circle>

    <circle cx="120" cy="380" r="6" fill="#fbbf24" opacity="0.8">
        <animate
            attributeName="opacity"
            values="0.8;0.3;0.8"
            dur="2.5s"
            repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="280" r="5" fill="#38bdf8" opacity="0.7">
        <animate
            attributeName="opacity"
            values="0.7;0.2;0.7"
            dur="1.8s"
            repeatCount="indefinite"/>
    </circle>

    <!-- Optional: subtle corner highlight -->
    <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
</svg>