<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <!-- WeatherWise Adaptive Icon Background (Android) -->
    <!-- This is the full-bleed background for Android adaptive icons -->

    <defs>
        <linearGradient id="adaptiveBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a"/>
            <stop offset="50%" style="stop-color:#1e40af"/>
            <stop offset="100%" style="stop-color:#1e3a8a"/>
        </linearGradient>

        <!-- Mask for safe zone -->
        <mask id="iconMask">
            <rect width="512" height="512" fill="white"/>
            <circle cx="256" cy="256" r="174" fill="black"/>
        </mask>
    </defs>

    <!-- Full-bleed background -->
    <rect width="512" height="512" fill="url(#adaptiveBg)"/>

    <!-- Subtle pattern overlay for texture -->
    <g opacity="0.1">
        <circle cx="100" cy="100" r="2" fill="white"/>
        <circle cx="200" cy="150" r="1.5" fill="white"/>
        <circle cx="350" cy="80" r="2" fill="white"/>
        <circle cx="400" cy="300" r="1.5" fill="white"/>
        <circle cx="150" cy="400" r="2" fill="white"/>
        <circle cx="300" cy="380" r="1.5" fill="white"/>
        <circle cx="80" cy="250" r="1" fill="white"/>
        <circle cx="420" cy="200" r="1" fill="white"/>
    </g>
</svg>