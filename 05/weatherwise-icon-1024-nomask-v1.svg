<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <!-- WeatherWise App Icon - iOS/Android Icon (516×516 for Apple) -->
    <!-- Apple requires 1024×1024 without rounded corners (mask applied by system) -->

    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a"/>
            <stop offset="50%" style="stop-color:#1e40af"/>
            <stop offset="100%" style="stop-color:#1e3a8a"/>
        </linearGradient>
        <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fbbf24"/>
            <stop offset="100%" style="stop-color:#f59e0b"/>
        </linearGradient>
        <linearGradient id="cloud" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff"/>
            <stop offset="100%" style="stop-color:#cbd5e1"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Background (no rounded corners - Apple applies mask) -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Sun -->
    <g filter="url(#glow)">
        <circle cx="150" cy="160" r="70" fill="url(#sun)"/>
        <g stroke="url(#sun)" stroke-width="12" stroke-linecap="round">
            <line x1="150" y1="75" x2="150" y2="45"/>
            <line x1="215" y1="115" x2="245" y2="85"/>
            <line x1="235" y1="160" x2="275" y2="160"/>
            <line x1="215" y1="205" x2="245" y2="235"/>
            <line x1="150" y1="245" x2="150" y2="275"/>
            <line x1="85" y1="205" x2="55" y2="235"/>
            <line x1="65" y1="160" x2="25" y2="160"/>
            <line x1="85" y1="115" x2="55" y2="85"/>
        </g>
    </g>

    <!-- Cloud -->
    <g filter="url(#glow)">
        <ellipse cx="340" cy="340" rx="100" ry="50" fill="url(#cloud)"/>
        <ellipse cx="380" cy="320" rx="70" ry="55" fill="url(#cloud)"/>
        <ellipse cx="420" cy="350" rx="60" ry="45" fill="url(#cloud)"/>
        <ellipse cx="300" cy="350" rx="80" ry="45" fill="url(#cloud)"/>
        <ellipse cx="320" cy="330" rx="40" ry="20" fill="rgba(255,255,255,0.3)"/>
    </g>

    <!-- Sparkles -->
    <circle cx="380" cy="120" r="8" fill="#38bdf8" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="380" r="6" fill="#fbbf24" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="280" r="5" fill="#38bdf8" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
</svg>