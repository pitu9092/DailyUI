<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - DailyUI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-picture">
                <div class="avatar">AJ</div>
            </div>
            <div class="profile-info">
                <h1 class="name">Alex Johnson</h1>
                <p class="username">@alexjohnson</p>
                <p class="bio">Designer & Developer | Passionate about creating beautiful user experiences. Coffee enthusiast ☕</p>
                <div class="skill-tags">
                    <span class="skill-tag">UI Design</span>
                    <span class="skill-tag">React</span>
                    <span class="skill-tag">UX</span>
                </div>
                <div class="availability-badge">Available for Work</div>
            </div>
            <div class="action-buttons">
                <button class="follow-btn">Follow</button>
                <button class="message-btn">Message</button>
            </div>
        </div>
        <div class="stats">
            <div class="stat">
                <span class="stat-number">1,234</span>
                <span class="stat-label">Posts</span>
            </div>
            <div class="stat">
                <span class="stat-number">5,678</span>
                <span class="stat-label">Followers</span>
            </div>
            <div class="stat">
                <span class="stat-number">890</span>
                <span class="stat-label">Following</span>
            </div>
        </div>
    </div>
</body>
</html>
