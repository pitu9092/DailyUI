<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .background-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800&h=800&fit=crop&crop=center') center/cover;
            filter: blur(40px) brightness(0.3);
            z-index: -1;
            transition: all 0.5s ease;
        }
        .player-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.1), rgba(30, 144, 255, 0.1));
            border-radius: inherit;
            z-index: -1;
        }
        .album-art {
            width: 320px;
            height: 320px;
            border-radius: 24px;
            overflow: hidden;
            margin: 0 auto 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .album-art:hover img {
            transform: scale(1.05);
        }
        .album-art::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .song-info {
            text-align: center;
            margin-bottom: 32px;
        }
        .song-title {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .artist {
            font-size: 1.1rem;
            opacity: 0.7;
            font-weight: 400;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin: 32px 0 24px;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        .play-pause {
            font-size: 1.8rem;
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.3);
        }
        .play-pause:hover {
            box-shadow: 0 16px 48px rgba(102, 126, 234, 0.4);
        }
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 24px 0 16px;
            cursor: pointer;
            position: relative;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            border-radius: inherit;
            transition: width 0.1s ease;
        }
        .progress::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            transform: translate(50%, -50%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 24px;
        }
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .left-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .right-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .smart-controls {
            display: flex;
            gap: 12px;
        }
        .smart-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .smart-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .smart-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .like-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .like-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }
        .like-btn.liked {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: 16px;
        }
        .volume-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
            font-size: 1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .volume-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .volume-bar {
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .volume-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 70%;
            border-radius: inherit;
        }
        .waveform {
            height: 40px;
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            border-radius: 20px;
            overflow: hidden;
            margin: 24px auto 0;
            width: 90%;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: relative;
        }
        .waveform::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(102, 126, 234, 0.5) 20%,
                rgba(118, 75, 162, 0.8) 40%,
                rgba(102, 126, 234, 0.5) 60%,
                transparent 80%);
            animation: wave 2s infinite linear;
        }
        @keyframes wave {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .player.playing .waveform {
            opacity: 1;
        }
        .lyrics-preview {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 24px;
            border-radius: 16px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
            max-width: 300px;
        }
        .lyrics-preview.show {
            opacity: 1;
        }
        .lyrics-text {
            font-size: 1rem;
            line-height: 1.4;
            opacity: 0.9;
        }
        @media (max-width: 480px) {
            .player {
                padding: 24px;
                max-width: 100%;
                margin: 0 16px;
            }
            .album-art {
                width: 280px;
                height: 280px;
            }
            .song-title {
                font-size: 1.8rem;
            }
            .artist {
                font-size: 1rem;
            }
            .controls {
                gap: 16px;
            }
            .control-btn {
                width: 48px;
                height: 48px;
                font-size: 1rem;
            }
            .play-pause {
                width: 64px;
                height: 64px;
                font-size: 1.5rem;
            }
            .bottom-controls {
                flex-direction: column;
                gap: 16px;
            }
            .left-controls, .right-controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="background-blur" id="backgroundBlur"></div>
    <div class="player-container">
        <div class="player" id="player">
            <div class="album-art" id="albumArt">
                <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=400&fit=crop&crop=center" alt="Album Cover">
            </div>
            <div class="song-info">
                <div class="song-title">Midnight Serenity</div>
                <div class="artist">Luna Collective</div>
            </div>
            <div class="controls">
                <button class="control-btn" id="shuffleBtn">🔀</button>
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="control-btn play-pause" id="playPauseBtn">▶️</button>
                <button class="control-btn" id="nextBtn">⏭</button>
                <button class="control-btn" id="repeatBtn">🔁</button>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress" id="progress"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">4:23</span>
            </div>
            <div class="waveform" id="waveform"></div>
            <div class="bottom-controls">
                <div class="left-controls">
                    <div class="volume-container">
                        <button class="volume-btn" id="volumeDown">🔉</button>
                        <div class="volume-bar" id="volumeBar">
                            <div class="volume-fill" id="volumeFill"></div>
                        </div>
                        <button class="volume-btn" id="volumeUp">🔊</button>
                    </div>
                    <button class="like-btn" id="likeBtn">❤️</button>
                </div>
                <div class="right-controls">
                    <button class="smart-btn" id="lyricsBtn">📝</button>
                    <button class="smart-btn" id="queueBtn">📋</button>
                </div>
            </div>
        </div>
        <div class="lyrics-preview" id="lyricsPreview">
            <div class="lyrics-text">Lost in the midnight glow<br>Where the shadows softly flow<br>Dreams awaken in the dark<br>Lighting up the sleeping heart</div>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const waveform = document.getElementById('waveform');
        const volumeDown = document.getElementById('volumeDown');
        const volumeUp = document.getElementById('volumeUp');
        const volumeFill = document.getElementById('volumeFill');
        const likeBtn = document.getElementById('likeBtn');
        const lyricsBtn = document.getElementById('lyricsBtn');
        const lyricsPreview = document.getElementById('lyricsPreview');
        const backgroundBlur = document.getElementById('backgroundBlur');

        let isPlaying = false;
        let currentTime = 0;
        let isLiked = false;
        let isShuffled = false;
        let isRepeated = false;
        let lyricsVisible = false;
        const duration = 263; // 4:23 in seconds

        // Format time
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Update progress bar
        function updateProgress() {
            const percent = (currentTime / duration) * 100;
            progress.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(currentTime);
        }

        // Play/Pause
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playPauseBtn.innerHTML = isPlaying ? '⏸️' : '▶️';
            player.classList.toggle('playing', isPlaying);
            if (isPlaying) {
                startTimer();
            } else {
                stopTimer();
            }
        });

        // Timer simulation
        let timer;
        function startTimer() {
            timer = setInterval(() => {
                if (currentTime >= duration) {
                    if (isRepeated) {
                        currentTime = 0;
                    } else {
                        nextBtn.click();
                        return;
                    }
                } else {
                    currentTime++;
                    updateProgress();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timer);
        }

        // Previous/Next
        prevBtn.addEventListener('click', () => {
            currentTime = 0;
            updateProgress();
        });

        nextBtn.addEventListener('click', () => {
            currentTime = 0;
            updateProgress();
        });

        // Shuffle
        shuffleBtn.addEventListener('click', () => {
            isShuffled = !isShuffled;
            shuffleBtn.classList.toggle('active', isShuffled);
        });

        // Repeat
        repeatBtn.addEventListener('click', () => {
            isRepeated = !isRepeated;
            repeatBtn.classList.toggle('active', isRepeated);
        });

        // Progress bar click
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            currentTime = Math.floor(percent * duration);
            updateProgress();
        });

        // Volume controls
        volumeDown.addEventListener('click', () => {
            let currentWidth = parseInt(volumeFill.style.width) || 70;
            currentWidth = Math.max(0, currentWidth - 10);
            volumeFill.style.width = currentWidth + '%';
        });

        volumeUp.addEventListener('click', () => {
            let currentWidth = parseInt(volumeFill.style.width) || 70;
            currentWidth = Math.min(100, currentWidth + 10);
            volumeFill.style.width = currentWidth + '%';
        });

        // Like button
        likeBtn.addEventListener('click', () => {
            isLiked = !isLiked;
            likeBtn.classList.toggle('liked', isLiked);
            likeBtn.innerHTML = isLiked ? '❤️' : '🤍';
        });

        // Lyrics toggle
        lyricsBtn.addEventListener('click', () => {
            lyricsVisible = !lyricsVisible;
            lyricsPreview.classList.toggle('show', lyricsVisible);
            lyricsBtn.classList.toggle('active', lyricsVisible);
        });

        // Initialize
        updateProgress();
        currentTimeEl.textContent = '0:00';
        durationEl.textContent = formatTime(duration);
        likeBtn.innerHTML = '🤍';

        // Dynamic background based on album art
        const albumImg = document.querySelector('.album-art img');
        albumImg.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = albumImg.naturalWidth;
            canvas.height = albumImg.naturalHeight;
            ctx.drawImage(albumImg, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            let r = 0, g = 0, b = 0;
            for (let i = 0; i < data.length; i += 4) {
                r += data[i];
                g += data[i + 1];
                b += data[i + 2];
            }
            r = Math.floor(r / (data.length / 4));
            g = Math.floor(g / (data.length / 4));
            b = Math.floor(b / (data.length / 4));

            backgroundBlur.style.background = `linear-gradient(135deg, rgba(${r}, ${g}, ${b}, 0.3) 0%, rgba(${r - 20}, ${g - 20}, ${b - 20}, 0.5) 50%, rgba(${r - 40}, ${g - 40}, ${b - 40}, 0.7) 100%)`;
        };
    </script>
</body>
</html>
